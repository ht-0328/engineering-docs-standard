# doc_lint の設定
#
# ここに書いてあることが、機械で検査できるルールのすべてである。
# ルールを変えたいときは、このファイルを直す。tools/doc_lint.py は直さない。
#
# 各ルールには標準本文のルールIDを対応させている。対応先は次のとおり。
#   B-xx: docs/02-before-writing.md
#   C-xx: docs/03-structure.md
#   S-xx: docs/04-sentences.md
#   P-xx: docs/05-presentation.md
#   O-xx: docs/10-operations.md

# 検査対象と除外
target:
  include:
    - "docs/**/*.md"
    - "templates/**/*.md"
    - "README.md"
  exclude:
    - "research/**"          # 出典ノートは原文の引用を含むため検査しない
    - "site/**"

# fail_on に指定した重大度「以上」が1件でもあれば、終了コード1で失敗する。
severity:
  fail_on: error

rules:

  # --- 文 ---

  sentence_length:
    enabled: true
    doc_rule: S-02
    warn_over: 50            # SRC-WRITE-003 2.3 の目安
    # 文の長さは目安であって違反ではない（docs/01-what-is-good.md）。
    # そのため error にする閾値は持たない。どれだけ長くても warning である。
    message: "一文が長い。主題が複数入っていないか確認する"

  commas_per_sentence:
    enabled: true
    doc_rule: S-14
    warn_over: 3             # 読点4つ以上は主題が複数ある兆候
    message: "一文の読点が多い。係り受けが一意か確認する"

  double_negative:
    enabled: true
    doc_rule: S-06
    patterns:
      - "ないと.*ない"
      - "なければ.*ない"
      - "なくはない"
      - "ないことはない"
    message: "二重否定になっている。肯定形に書き換える"

  vague_words:
    enabled: true
    doc_rule: S-07
    severity: warning
    # docs/04-sentences.md S-07 と docs/appendix-glossary.md「使わない語」に
    # 挙げた語をすべて含める。3か所の語彙は同じでなければならない。
    words:
      - 適切に
      - 適宜
      - 必要に応じて
      - 可能な限り
      - 速やかに
      - 早めに
      - なるべく早く
      - できるだけ早く
      - 十分に
      - 大量の
      - 多数の
      - 一部の
      - 極力
      - しっかりと
      - きちんと
      - なるはや
      - 巻き取
      - エビデンス
    message: "曖昧な語。数値・固有名詞・日時に置き換える"

  timeless:
    enabled: true
    doc_rule: O-03
    severity: warning
    # docs/10-operations.md O-03 の表と同じ語を並べる。
    words:
      - 現在は
      - 現時点では
      - 今のところ
      - 現状では
      - 今後
      - 将来的に
      - 近日
      - まもなく
      - 最新の
      - 新しいバージョン
      - 従来の
      - 以前は
    message: "時点に依存する語。日付か版数で書く"

  # --- 表記 ---

  open_in_hiragana:
    enabled: true
    doc_rule: S-12
    severity: warning
    # SRC-EXT-003（JTF日本語標準スタイルガイド 第4.0版）2.2.1 の「ひらがなで書く」
    # 一覧から、誤検出が少ないものを選んでいる。
    pairs:
      予め: あらかじめ
      尚: なお
      但し: ただし
      又は: または
      若しくは: もしくは
      更に: さらに
      然し: しかし
      即ち: すなわち
      暫く: しばらく
      凡そ: およそ
      却って: かえって
      寧ろ: むしろ
      滅多に: めったに
      最早: もはや
      余程: よほど
      度々: たびたび
      折角: せっかく
      出来る: できる
      出来ます: できます
      下さい: ください
      何処: どこ
      乃至: ないし
      中々: なかなか
    message: "JTFスタイルガイドはこの語をひらがなで書くよう定めている"

  style_mixing:
    enabled: true
    doc_rule: S-13
    # 本文の敬体・常体の混在を検出する。文書ごとに多数派を正とし、少数派を報告する。
    # 体言止めと断片は判定しない。無理に常体へ寄せると誤検出が増える。
    min_sentences: 10        # これ未満の文書では判定しない
    message: "本文の文体が混在している。敬体か常体のどちらかに統一する"

  list_style_mixing:
    enabled: true
    doc_rule: S-13
    # SRC-EXT-003 1.1.3「ひとまとまりの箇条書きでは、敬体と常体を混在させません」
    message: "ひとまとまりの箇条書きの中で文体が混在している"

  heading_no_period:
    enabled: true
    doc_rule: C-02
    message: "見出しの文末に句点（。）を付けない"

  # --- 構造 ---

  single_h1:
    enabled: true
    doc_rule: C-03
    message: "h1 は1ファイルに1つだけ置く"

  heading_level_skip:
    enabled: true
    doc_rule: C-03
    message: "見出しの階層が飛んでいる"

  heading_max_depth:
    enabled: true
    doc_rule: C-04
    max_depth: 4
    message: "見出しが深すぎる。文書の分割を検討する"

  empty_section:
    enabled: true
    doc_rule: C-03
    message: "見出しの直後に本文がない。走査する読者はここで内容を判断できない"

  vague_heading:
    enabled: true
    doc_rule: C-02
    severity: warning
    words:
      - その他
      - 補足
      - 詳細
      - 備考
      - 参考
    message: "見出しから内容を予測できない。具体的に書く"

  paragraph_sentences:
    enabled: true
    doc_rule: C-07
    warn_over: 7             # SRC-EXT-001: 3〜5文が歓迎され、7文超は避けられる
    message: "段落の文数が多い。トピックが複数入っていないか確認する"

  list_items:
    enabled: true
    doc_rule: C-07
    warn_over: 7             # SRC-WRITE-003 4.7: マジックナンバー7
    message: "箇条書きの項目が多い。グループ化するか、絞る"

  document_metadata:
    enabled: true
    doc_rule: C-08
    # 独立した文書に、いつ・誰に・誰が・何のためかを持たせる。
    # docs/ の本文は全体で1つの文書として扱い、メタ情報は docs/index.md が持つ。
    # この判断は docs/index.md に書いてある。
    paths:
      - "templates/"
      - "README.md"
      - "docs/index.md"
    within_lines: 40
    require:
      - 保守責任者
      - 最終確認日
      - 想定読者
    message: "冒頭のメタ情報が足りない"

  # --- 見せ方 ---

  code_block_language:
    enabled: true
    doc_rule: P-04
    message: "コードブロックに言語名が指定されていない"

  link_text:
    enabled: true
    doc_rule: P-05
    words:
      - こちら
      - ここ
      - この記事
      - このページ
      - リンク
      - click here
    message: "リンク文字列から行き先が分からない"

  bare_url_link:
    enabled: true
    doc_rule: P-05
    severity: warning
    message: "URLそのものをリンク文字列にしている。ページ名か内容の説明を使う"

  broken_local_link:
    enabled: true
    doc_rule: P-05
    message: "リンク先のファイルが存在しない"

  broken_anchor:
    enabled: true
    doc_rule: P-05
    # アンカーの生成規則は tools/build_site.py の slugify と同じにしてある。
    message: "リンク先に、その見出しが無い"

  image_alt:
    enabled: true
    doc_rule: P-03
    severity: warning
    message: "画像に代替テキストが無い"

  table_columns:
    enabled: true
    doc_rule: P-02
    message: "表の列数がそろっていない"

  table_cell_length:
    enabled: true
    doc_rule: P-02
    warn_over: 2             # SRC-EXT-001: セルが2文を超えたら別の形式を検討
    message: "表のセルに文章が多い。別の形式を検討する"

  # --- 保守 ---

  unresolved_marker:
    enabled: true
    doc_rule: O-07
    words:
      - TBD
      - TODO
      - FIXME
      - "???"
      - 未定(?!義)
    message: "未解決の印が残っている"

  # --- 用語の統一 ---

  term_consistency:
    enabled: true
    doc_rule: S-10
    # 同じ概念を指す表記のまとまりを列挙する。
    # どれが正しいかは決めない。**1つの文書の中で混ざっていること**を検出する。
    # 用語集（docs/appendix-glossary.md）は、既存文書が一方で統一されていれば
    # それを尊重するとしている。常に片方を正とすると、統一済みの文書を誤検出する。
    groups:
      user:      [ユーザー, ユーザ, エンドユーザー, エンドユーザ]
      server:    [サーバー, サーバ]
      memory:    [メモリー, メモリ]
      computer:  [コンピューター, コンピュータ]
      driver:    [ドライバー, ドライバ]
      folder:    [フォルダー, フォルダ]
      printer:   [プリンター, プリンタ]
    message: "同じ概念に2通りの表記が使われている"
