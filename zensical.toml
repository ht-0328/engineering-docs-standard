# Zensical 版のサイト設定。
#
#   docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/w" -w /w \
#     edocs-zensical python tools/build_site_zensical.py
#
# 既存の tools/build_site.py を置き換えるものではない。同じ docs/ から
# 別の道具で作った版を並べ、どちらを残すか決めるために置いている。
#
# docs_dir が docs/ ではないことに注意する。Zensical は docs_dir の中だけを
# サイトにするため、docs/ の外を指すリンクを書き換えた写しを一度作る。
# その置き場が build/zensical/ である。作るのは build_site_zensical.py である。

[project]
site_name = "エンジニアのためのドキュメント標準"
site_description = "質の高い技術文書を書き、レビューするための、根拠つきのルール集"
# 本編とは別の場所に出す。比べるあいだだけ、同じ内容を2つ公開する。
# 理由は docs/adr/ADR-002-site-generator.md にある。
site_url = "https://ht-0328.github.io/engineering-docs-standard/zensical/"

repo_url = "https://github.com/ht-0328/engineering-docs-standard"
repo_name = "ht-0328/engineering-docs-standard"

# すべてのページの下に出る。深い階層から入った読者にも、
# これが比較用であることと、本編の場所が分かるようにする。
copyright = 'これは比較用の Zensical 版である。正本は <a href="https://ht-0328.github.io/engineering-docs-standard/">本編のサイト</a> にある。'

docs_dir = "build/zensical"
site_dir = "site-zensical"

# 図を描く Mermaid を同梱する。読み込み元は build/zensical/assets/ であり、
# 中身は tools/vendor/mermaid.min.js の写しである。
# 外部への通信を起こさないため、CDN からは読まない。
extra_javascript = ["assets/mermaid.min.js", "assets/mermaid-init.js"]

# サイドバーの並び。既存の tools/build_site.py の SECTIONS と同じにしている。
# 見出し名を変えるときは、両方を直す。
nav = [
  { "はじめに" = ["index.md"] },
  { "原則" = ["01-what-is-good.md", "02-before-writing.md"] },
  { "書き方" = ["03-structure.md", "04-sentences.md", "05-presentation.md"] },
  { "レビュー" = ["06-review.md", "07-antipatterns.md"] },
  { "実践" = ["08-templates.md", "09-your-instincts.md", "10-operations.md"] },
  { "付録" = [
      "appendix-checklist.md",
      "appendix-glossary.md",
      "adr/ADR-001-diagram-tool.md",
      "adr/ADR-002-site-generator.md",
  ] },
]

[project.theme]
language = "ja"

# 書体を読み込まない。既定のままだと Google Fonts へ通信が出る。
# 「生成したサイトは外部への通信を行わない」という方針を守るために false にする。
font = false

features = [
  "content.code.copy",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

# 明るい表示と暗い表示を切り替える。既定は閲覧環境の設定に従う。
[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "明るい表示に切り替える"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "暗い表示に切り替える"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "閲覧環境の設定に戻す"

[project.markdown_extensions]
admonition = {}
attr_list = {}
def_list = {}
md_in_html = {}
tables = {}
toc.permalink = true

# 見出しのアンカーを、doc_lint.py と同じ規則で作る。実体は tools/mdslug.py にある。
# 既定のままだと日本語の見出しが `_2` `_3` のような通し番号になり、
# 本文中の `#日本語の見出し` へのリンクがすべて切れる。
toc.slugify = { object = "mdslug.toc_slugify" }

# ```mermaid を <pre class="mermaid"> にする。描画は mermaid-init.js が行う。
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
